name: Setup
description: 'Setup stuff'
inputs:
  encryption_key:
    default: ""
    description: "Encryption key for Gradle Configuration Cache"
runs:
  using: "composite"
  steps:
    - name: set up JDK 26
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'zulu'
        java-version: '26'
    - name: Set up jemalloc
      uses: kaeawc/setup-jemalloc@8d1b178eec3d6a3e91933852c8d9ca5359a5cac6 # v0.0.5
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        cache-encryption-key: ${{ inputs.encryption_key }}
