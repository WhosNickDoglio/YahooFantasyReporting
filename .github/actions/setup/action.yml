name: Setup
description: 'Setup stuff'
inputs:
  encryption_key:
    default: ""
    description: "Encryption key for Gradle Configuration Cache"
runs:
  using: "composite"
  steps:
    - name: set up JDK 27
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'zulu'
        java-version: '27'
    - name: Set up jemalloc
      uses: kaeawc/setup-jemalloc@2c377b1a87e4f48c405f69642eb5e82a13ce3987 # v0.1.0
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      with:
        cache-encryption-key: ${{ inputs.encryption_key }}
