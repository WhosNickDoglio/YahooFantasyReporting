[versions]
ksoup = "0.2.5"
kotlin = "2.2.21"
jdkTarget = "17"
mockingbird = "2.3.0"
coroutines = "1.10.2"
jdk = "24"
ktfmt = "0.59"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version = "0.8.1" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.3" }
burst = { id = "app.cash.burst" }
convention-jvm = { id = "dev.whosnickdoglio.convention.kotlin", version = "0.2.0" }
detekt = { id = "io.gitlab.arturbosch.detekt", version = "1.23.8" }
lint = { id = "com.android.lint", version = "8.13.1" }
doctor = { id = "com.osacky.doctor", version = "0.12.1" }
dependencyAnalysis = { id = "com.autonomousapps.dependency-analysis", version = "3.5.1" }
sortDependencies = { id = "com.squareup.sort-dependencies", version = "0.16" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.3" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version = "0.25.0" }

[libraries]
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
ksoup-network = { module = "com.fleeksoft.ksoup:ksoup-network", version.ref = "ksoup" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }

google-api-client = { module = "com.google.api-client:google-api-client", version = "2.8.1" }
google-sheets = { module = "com.google.apis:google-api-services-sheets", version = "v4-rev20251110-2.0.0" }

# https://www.slf4j.org/codes.html#noProviders
slf4j = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }

# Only present to trigger automatic renovate updates
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }

mockingbird = { module = "com.anthonycr.mockingbird:core", version.ref = "mockingbird" }
mockingbird-compiler = { module = "com.anthonycr.mockingbird:processor", version.ref = "mockingbird" }

junit = { module = "junit:junit", version = "4.13.2" }
burst = { module = "app.cash.burst:burst-gradle-plugin", version = "2.10.2" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version = "0.28.1" }
